
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StudyNo</title>
<link rel="stylesheet" href="style.css">
<script src="database.js"></script>
<style>
:root{
  --purple:#b98ee0;
  --purple-soft:rgba(185,142,224,0.45);
  --border:rgba(255,255,255,0.14);
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#fff;
 
  padding-bottom:60px;
}

/* ---------- BACK BUTTON ---------- */
#back{
  position:fixed;
  top:24px; left:24px;
  width:42px; height:42px;
  border-radius:50%;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.08);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  backdrop-filter:blur(px);
  transition:.15s ease;
  z-index:20;
}
#back:hover{background:rgba(255,255,255,0.14); transform:scale(1.05);}
#back:active{transform:scale(0.95);}

/* ---------- AGENDA TOGGLE ---------- */
#agendaBtn{
  position:fixed;
  top:24px; right:24px;
  height:42px; padding:0 18px;
  border-radius:999px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.08);
  color:#fff;
  display:flex;align-items:center;gap:8px;
  cursor:pointer;
  backdrop-filter:blur(5px);
  font-size:13px; font-weight:600;
  transition:.15s ease;
  z-index:20;
}
#agendaBtn:hover{background:rgba(255,255,255,0.14);}

/* ---------- HERO ---------- */
#hero{
  text-align:center;
  margin:110px 0 40px;
  font-size:clamp(40px,7vw,68px);
  font-weight:650;
  letter-spacing:-2px;
}
#hero span{
    color: #8751cd;
}

/* ---------- NEW TASK ---------- */
.new-event{
  width:min(850px,90%);
  margin:0 auto 30px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  padding:14px;border-radius:22px;
  background:linear-gradient(135deg,rgba(255,255,255,0.10),rgba(255,255,255,0.03));
  border:1px solid var(--border);
  backdrop-filter:blur(5px) saturate(130%);
  box-shadow:0 10px 35px rgba(0,0,0,0.25), inset 0 1px rgba(255,255,255,0.10);
}
.new-event input[type=text]{flex:2;min-width:160px;}
.new-event input[type=date]{flex:1;min-width:130px;}
input[type=text],input[type=date],input[type=url]{
  height:44px;border:1px solid var(--border);border-radius:14px;
  padding:0 14px;background:rgba(255,255,255,0.07);color:#fff;
  outline:none;font-size:14px;font-family:inherit;
}
input::placeholder{color:rgba(255,255,255,0.4);}
input:focus{
  border-color:var(--purple-soft);
  box-shadow:0 0 0 3px rgba(185,142,224,0.15);
}
.weight-wrap{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,0.65);}

.checkbox-wrap{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,0.7);white-space:nowrap;cursor:pointer;}
.checkbox-wrap input{width:18px;height:18px;accent-color:var(--purple);cursor:pointer;}

.btn{
  height:44px;padding:0 20px;border:none;border-radius:14px;
  background:#fff;color:#111;font-weight:600;font-size:14px;cursor:pointer;
  transition:.15s ease;
}
.btn:hover{transform:scale(1.03);}
.btn:active{transform:scale(0.96);}
.btn-purple{background:var(--purple);color:#fff;}
.btn-ghost{background:rgba(255,255,255,0.08);color:#fff;border:1px solid var(--border);}
.btn-small{height:34px;padding:0 14px;font-size:13px;}

/* ---------- LIQUID GLASS EXPANDING WINDOWS ---------- */
.glass-window{
  width:min(850px,90%);
  margin:0 auto 20px;
  border-radius:22px;
  background:linear-gradient(135deg,rgba(255,255,255,0.10),rgba(255,255,255,0.03));
  border:1px solid var(--border);
  backdrop-filter:blur(5px) saturate(130%);
  -webkit-backdrop-filter:blur(5px) saturate(130%);
  box-shadow:0 10px 35px rgba(0,0,0,0.25), inset 0 1px rgba(255,255,255,0.10);
  overflow:hidden;
  transition:box-shadow .2s ease, background .2s ease;
}
.glass-window[open]{
  background:linear-gradient(135deg,rgba(255,255,255,0.13),rgba(255,255,255,0.04));
}
.glass-window > summary{
  list-style:none;cursor:pointer;user-select:none;
  display:flex;align-items:center;gap:10px;
  padding:18px 22px;
  font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:1px;
  color:rgba(255,255,255,0.85);
}
.glass-window > summary::-webkit-details-marker{display:none;}
.glass-window > summary::marker{content:"";}
.win-count{
  font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;
  background:rgba(185,142,224,0.25);color:#e6d4fa;text-transform:none;letter-spacing:0;
}
.chev{margin-left:auto;transition:transform .25s ease;flex-shrink:0;opacity:0.6;}
.glass-window[open] .chev{transform:rotate(180deg);}
.window-body{
  padding:0 20px 20px;
  display:flex;flex-direction:column;gap:10px;
}

/* ---------- TASK LIST ---------- */
.task-container{
  display:flex;flex-direction:column;gap:10px;
}
.task{
  padding:14px 18px;border-radius:20px;
  background:linear-gradient(135deg,rgba(255,255,255,0.09),rgba(255,255,255,0.03));
  border:1px solid var(--border);
  transition:.2s ease;
}
.task:hover{background:linear-gradient(135deg,rgba(255,255,255,0.13),rgba(255,255,255,0.05));}
.task.toets{border:2px solid var(--purple-soft);}
.task-row{display:flex;align-items:center;gap:14px;}
.task input[type=checkbox]{width:19px;height:19px;accent-color:var(--purple);cursor:pointer;flex-shrink:0;}
.task-main{flex:1;min-width:0;}
.task-text{font-size:16px;overflow-wrap:anywhere;}
.task-meta{font-size:12px;color:rgba(255,255,255,0.5);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.badge{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;}
.badge-toets{background:rgba(185,142,224,0.25);color:#e6d4fa;}
.badge-due{background:rgba(255,120,120,0.22);color:#ffb3b3;}
.task-actions{display:flex;gap:6px;flex-shrink:0;}
.icon-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--border);
  background:rgba(255,255,255,0.06);color:#fff;cursor:pointer;display:flex;
  align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
}
.icon-btn:hover{background:rgba(255,255,255,0.14);}
.empty{color:rgba(255,255,255,0.4);text-align:center;padding:30px 0;font-size:14px;}

/* ---------- STUDY PLAN PANEL (inline in task, tests only) ---------- */
.plan-panel{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);display:none;}
.plan-panel.open{display:block;}
.plan-hint{font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:10px;}
.plan-steps{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.plan-step{
  display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;
  background:rgba(255,255,255,0.05);font-size:13px;
}
.plan-step .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.25);flex-shrink:0;}
.plan-step.now .dot{background:var(--purple);box-shadow:0 0 8px var(--purple);}
.plan-step.done{opacity:0.4;}
.plan-step .when{margin-left:auto;font-size:11px;color:rgba(255,255,255,0.45);white-space:nowrap;}

.material-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.material-row input{flex:1;min-width:160px;}
.material-link{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 16px;border-radius:14px;
  background:rgba(185,142,224,0.18);border:1px solid var(--purple-soft);
  color:#e6d4fa;text-decoration:none;font-size:13px;font-weight:600;
}
.material-link:hover{background:rgba(185,142,224,0.28);}

/* ---------- AGENDA OVERLAY (calendar grid) ---------- */
#agendaOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);
  display:none;align-items:flex-start;justify-content:center;
  z-index:50;padding:70px 16px 40px;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
#agendaOverlay.open{display:flex;}
#agendaPanel{
    backdrop-filter:blur(7px) saturate(150%);
  -webkit-backdrop-filter:blur(7px) saturate(150%);
  width:min(880px,100%);
  border-radius:24px;padding:22px;
  background:linear-gradient(135deg,rgba(30, 22, 50, 0.515),rgba(20,15,35,0.98));
  border:1px solid var(--border);
  box-shadow:0 30px 90px rgba(0,0,0,0.5);
}
.agenda-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.agenda-header h2{margin:0;font-size:19px;}
.month-nav{display:flex;align-items:center;gap:10px;}
.month-nav button{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--border);
  background:rgba(255,255,255,0.06);color:#fff;cursor:pointer;
}
.month-nav button:hover{background:rgba(255,255,255,0.14);}

.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:6px;
}
.cal-dow{
  text-align:center;font-size:11px;color:rgba(255,255,255,0.4);
  text-transform:uppercase;letter-spacing:0.5px;padding-bottom:4px;
}
.cal-cell{
  min-height:78px;border-radius:12px;padding:6px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);
  display:flex;flex-direction:column;gap:4px;
}
.cal-cell.empty{background:transparent;border-color:transparent;}
.cal-cell.today{border-color:var(--purple-soft);background:rgba(185,142,224,0.08);}
.cal-daynum{font-size:11px;color:rgba(255,255,255,0.55);}
.cal-cell.today .cal-daynum{color:var(--purple);font-weight:700;}
.cal-chip{
  font-size:10px;padding:2px 6px;border-radius:6px;line-height:1.3;
  background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.85);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cal-chip.test{background:rgba(185,142,224,0.3);color:#f0e2fb;}
.cal-chip.study{background:rgba(120,200,255,0.18);color:#c9ecff;font-style:italic;}

#closeAgenda{display:block;margin:18px auto 0;}

/* =========================================================
   MOBILE (phones) — desktop styles above stay untouched
   ========================================================= */
@media (max-width:750px){
  body{padding-bottom:40px;}

  /* smaller, safely-inset top buttons so they don't collide with hero */
  #back{
    top:16px; left:16px; width:38px; height:38px;
  }
  #agendaBtn{
    top:16px; right:16px; height:38px; padding:0 14px;
  }
  #agendaBtn span.label{display:none;}
  #agendaBtn::after{content:"📅"; font-size:15px;}

  #hero{margin:84px 0 26px; font-size:clamp(30px,9vw,42px); letter-spacing:-1px; padding:0 12px;}

  /* stack the "add task" controls into a single column, full width */
  .new-event{
    width:92%;
    flex-direction:column;
    align-items:stretch;
    padding:14px;
    gap:10px;
  }
  .new-event input[type=text],
  .new-event input[type=date]{
    width:100%; flex:none;
  }
  .weight-wrap{width:100%; justify-content:space-between;}
  .weight-wrap input[type=range]{flex:1; width:auto;}
  .checkbox-wrap{width:100%; justify-content:flex-start;}
  #add{width:100%;}

  .glass-window{width:92%;}
  .glass-window > summary{padding:15px 16px; font-size:13px;}
  .window-body{padding:0 12px 16px;}

  /* task rows: let text wrap and actions stay reachable, no more clipping */
  .task{padding:12px 14px; border-radius:16px;}
  .task-row{gap:10px; flex-wrap:wrap;}
  .task-main{flex-basis:100%;order:2;min-width:0;}
  .task input[type=checkbox]{order:1;}
  .task-actions{order:3; margin-left:auto;}
  .task-text{font-size:15px;}
  .task-meta{font-size:11px;}

  .icon-btn{width:38px;height:38px;font-size:15px;} /* bigger tap targets */

  .plan-step{padding:9px 10px; font-size:12.5px;}
  .plan-step .when{font-size:10.5px;}
  .material-row input{min-width:0; width:100%;}
  .material-link{padding:9px 14px; font-size:12.5px;}

  /* agenda overlay: fit small screens, larger tap targets */
  #agendaOverlay{padding:66px 8px 24px;}
  #agendaPanel{padding:14px; border-radius:18px;}
  .agenda-header h2{font-size:16px;}
  .month-nav button{width:34px;height:34px;}

  .cal-grid{gap:4px;}
  .cal-dow{font-size:9.5px;}
  .cal-cell{min-height:44px; padding:4px; border-radius:9px;}
  .cal-daynum{font-size:10px;}
  .cal-chip{display:none;}
  .cal-cell.has-items{position:relative;}
  .cal-cell.has-items::after{
    content:"";
    position:absolute; left:50%; bottom:5px; transform:translateX(-50%);
    width:5px; height:5px; border-radius:50%; background:var(--purple);
  }

  #closeAgenda{width:100%;}
}

input[type="range"] {
    width: 120px;

    height: 32px;

    appearance: none;
    -webkit-appearance: none;

    background: transparent;

    cursor: pointer;
}


/* Track */

input[type="range"]::-webkit-slider-runnable-track {
    height: 7px;

    border-radius: 999px;

    background: rgba(255,255,255,0.12);

    border: 1px solid rgba(255,255,255,0.12);

    box-shadow:
        inset 0 1px rgba(255,255,255,0.08),
        inset 0 -1px rgba(0,0,0,0.25);
}


/* Thumb */

input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 25px;
    height: 25px;

    margin-top: -10px;

    border-radius: 50%;

    border: 1px solid rgba(118, 68, 161, 0.925);

    background: rgba(106, 72, 117, 0.9);

    box-shadow:
        0 4px 15px rgba(0,0,0,0.35),
        inset 0 1px rgba(255,255,255,1);

    transition: transform 0.15s ease;
}

input[type="range"]:hover::-webkit-slider-thumb {
    transform: scale(1.08);
}


/* Firefox */

input[type="range"]::-moz-range-track {
    height: 7px;

    border-radius: 999px;

    background: rgba(255,255,255,0.12);

    border: 1px solid rgba(255,255,255,0.12);
}

input[type="range"]::-moz-range-thumb {
    width: 25px;
    height: 25px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,0.8);

    background: rgba(255,255,255,0.9);

    box-shadow:
        0 4px 15px rgba(0,0,0,0.35);
}



</style>

<body>

<button id="back" onclick="location.href='index.html';">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 19 5 12 15 5"></polyline>
  </svg>
</button>

<button id="agendaBtn">
   <span class="label">Calender</span>
</button>

<h1 id="hero">Hey, <span id="userName">Guest</span></h1>

<div class="new-event">
  <input type="text" id="inputField" placeholder="Enter a task">
  <input type="date" id="dateField">
  <div class="weight-wrap">
    <span>Weight</span>
    <input type="range" id="weightField" min="1" max="50" value="10">
  </div>
  <label class="checkbox-wrap">
    <input type="checkbox" id="testCheckbox">
    Test
  </label>
  <button class="btn btn-purple" id="add">Add +</button>
</div>

<details class="glass-window" open>
  <summary>Today <span class="win-count" id="todayCount">0</span>
    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
  </summary>
  <div class="window-body task-container" id="todayContainer"></div>
</details>

<details class="glass-window" open>
  <summary>Coming up <span class="win-count" id="upcomingCount">0</span>
    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
  </summary>
  <div class="window-body task-container" id="upcomingContainer"></div>
</details>

<!-- ================= AGENDA OVERLAY (calendar grid) ================= -->
<div id="agendaOverlay">
  <div id="agendaPanel">
    <div class="agenda-header">
      <h2 id="monthLabel">Month</h2>
      <div class="month-nav">
        <button id="prevMonth">‹</button>
        <button id="todayBtn" style="width:auto;padding:0 10px;border-radius:999px;font-size:11px;">Today</button>
        <button id="nextMonth">›</button>
      </div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <button class="btn btn-ghost" id="closeAgenda">Close</button>
  </div>
</div>

<script>
/* =========================================================
   DATA
   ========================================================= */
  let Tasks = JSON.parse(localStorage.getItem("Tasks_v2")) || [];
const userNameEl = document.getElementById("userName");

userNameEl.innerText = localStorage.getItem("name_database");

function saveTasks(){ localStorage.setItem("Tasks_v2", JSON.stringify(Tasks)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* =========================================================
   TASK ADD
   ========================================================= */
document.getElementById("add").addEventListener("click", ()=>{
  const inputField = document.getElementById("inputField");
  const dateField = document.getElementById("dateField");
  const weightField = document.getElementById("weightField");
  const testCheckbox = document.getElementById("testCheckbox");

  const text = inputField.value.trim();
  const date = dateField.value;
  if(!text){ alert("Enter a task!"); return; }
  if(!date){ alert("Select a date!"); return; }

  const task = {
    id: uid(),
    text,
    date,
    weight: Number(weightField.value),
    isToets: testCheckbox.checked,
    completed: false,
    materialLink: ""
  };
  Tasks.push(task);
  saveTasks();
  inputField.value=""; dateField.value=""; weightField.value=10; testCheckbox.checked=false;
  renderWindows();
  renderCalendar();
});

/* =========================================================
   VISIBILITY / DATE HELPERS
   ========================================================= */
function getDaysBefore(weight){
  if (weight <= 10) return 1;
  if (weight <= 20) return 2;
  if (weight <= 30) return 3;
  if (weight <= 40) return 5;
  return 7;
}
function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr+"T00:00:00");
  return Math.round((d-today)/86400000);
}
function shouldShowNow(task){
  return daysUntil(task.date) <= getDaysBefore(task.weight);
}
function isoDate(d){ return d.toISOString().slice(0,10); }

/* =========================================================
   STUDY PLAN — number of extra study stops scales with weight.
   Higher weight = more study sessions spread across the window.
   Sundays are kept free, Saturdays are avoided when there's enough
   room — but the day before the test ("Herhalen") is always kept,
   weekend or not, since it's fine if the deadline is close.
   ========================================================= */
function weekdayOffset(task, at){
  const dt = new Date(task.date+"T00:00:00");
  dt.setDate(dt.getDate()-at);
  return dt.getDay(); // 0 = Sun, 6 = Sat
}

function finalizeSteps(stops, task){
  const d = daysUntil(task.date);
  return stops.sort((a,b)=>b.at-a.at).map(s=>{
    const stepDaysUntil = d - s.at;
    let when;
    if(stepDaysUntil < 0) when = "passed";
    else if(stepDaysUntil === 0) when = "today";
    else if(stepDaysUntil === 1) when = "tomorrow";
    else when = `in ${stepDaysUntil}d`;
    return {
      label: s.label,
      date: (()=>{ const dd=new Date(); dd.setHours(0,0,0,0); dd.setDate(dd.getDate()+stepDaysUntil); return isoDate(dd); })(),
      when,
      isNow: stepDaysUntil === 0,
      isDone: stepDaysUntil < 0
    };
  });
}

function buildPlan(task){
  const daysBefore = getDaysBefore(task.weight);
  const extraStops = Math.max(1, Math.round(task.weight / 10)); // 1–5 study sessions

  // window too tight for anything but the day before
  if(daysBefore <= 1){
    return finalizeSteps([{ label: "Herhalen", at: 1 }], task);
  }

  const offsets = [];
  for(let o=daysBefore; o>=2; o--) offsets.push(o); // "at 1" is reserved for Herhalen

  const noSun = offsets.filter(o => weekdayOffset(task,o) !== 0);
  const noWeekend = noSun.filter(o => weekdayOffset(task,o) !== 6);

  const needed = 1 + extraStops; // Read + study sessions
  let pool = noWeekend.length >= needed ? noWeekend
           : noSun.length >= needed ? noSun
           : offsets;
  pool.sort((a,b)=>b-a);

  if(pool.length === 0){
    return finalizeSteps([{ label: "Herhalen", at: 1 }], task);
  }

  const readAt = pool[0];
  const studyPool = pool.slice(1);

  let studyOffsets = [];
  if(studyPool.length === 1){
    studyOffsets = [studyPool[0]];
  } else if(studyPool.length > 1){
    for(let i=0;i<extraStops;i++){
      const idx = Math.round(i*(studyPool.length-1)/Math.max(1,extraStops-1));
      studyOffsets.push(studyPool[idx]);
    }
    studyOffsets = [...new Set(studyOffsets)];
  }
  studyOffsets.sort((a,b)=>b-a);

  const stops = [{ label: "Read", at: readAt }];
  studyOffsets.forEach((o,i)=> stops.push({ label: `Study ${i+1}/${studyOffsets.length}`, at: o }));
  stops.push({ label: "Herhalen", at: 1 });

  return finalizeSteps(stops, task);
}

/* =========================================================
   RENDER — three windows: Today / Study sessions / Coming up
   ========================================================= */
const todayContainer = document.getElementById("todayContainer");
const upcomingContainer = document.getElementById("upcomingContainer");
const todayCount = document.getElementById("todayCount");
const upcomingCount = document.getElementById("upcomingCount");

function activeTests(){ return Tasks.filter(t=>!t.completed && t.isToets); }

function renderWindows(){
  const todayIso = isoDate(new Date(new Date().setHours(0,0,0,0)));
  const in7 = new Date(); in7.setHours(0,0,0,0); in7.setDate(in7.getDate()+7);

  /* ---- Today: tasks due today + study sessions scheduled today ---- */
  todayContainer.innerHTML = "";
  const todayTasks = Tasks.filter(t=>!t.completed && t.date===todayIso);
  const todaySessions = [];
  activeTests().forEach(t=>{
    buildPlan(t).forEach(step=>{
      if(step.date===todayIso && step.date!==t.date) todaySessions.push({task:t, step});
    });
  });
  todayCount.textContent = todayTasks.length + todaySessions.length;
  if(todayTasks.length===0 && todaySessions.length===0){
    todayContainer.innerHTML = '<div class="empty">All caught up!</div>';
  } else {
    todayTasks.forEach(t=>todayContainer.appendChild(buildTaskEl(t)));
    todaySessions.forEach(s=>todayContainer.appendChild(buildSessionEl(s.task,s.step)));
  }

  /* ---- Coming up: deadlines in the next 7 days ---- */
  upcomingContainer.innerHTML = "";
  const deadlines = Tasks.filter(t=>!t.completed).filter(t=>{
    const dt = new Date(t.date+"T00:00:00");
    return dt > new Date(new Date().setHours(0,0,0,0)) && dt <= in7;
  }).sort((a,b)=>new Date(a.date)-new Date(b.date));
  upcomingCount.textContent = deadlines.length;
  if(deadlines.length===0){
    upcomingContainer.innerHTML = '<div class="empty">No deadlines in the next 7 days</div>';
  } else {
    deadlines.forEach(t=>upcomingContainer.appendChild(buildTaskEl(t)));
  }
}

/* Lightweight row for a planned study session (not a real task, no checkbox) */
function buildSessionEl(task, step){
  const wrap = document.createElement("div");
  wrap.className = "task toets";

  const row = document.createElement("div");
  row.className = "task-row";

  const main = document.createElement("div");
  main.className = "task-main";
  main.innerHTML = `
    <div class="task-text">${step.label} — ${task.text}</div>
    <div class="task-meta">
      <span>${new Date(step.date+"T00:00:00").toLocaleDateString('en-GB',{day:'numeric',month:'short'})} · ${step.when}</span>
      <span class="badge badge-toets">Study</span>
    </div>
  `;
  row.appendChild(main);
  wrap.appendChild(row);
  return wrap;
}

function buildTaskEl(task){
  const wrap = document.createElement("div");
  wrap.className = "task" + (task.isToets ? " toets" : "");

  const row = document.createElement("div");
  row.className = "task-row";

  const cb = document.createElement("input");
  cb.type="checkbox"; cb.checked=task.completed;
  cb.addEventListener("change", ()=>completeTask(task, wrap));

  const main = document.createElement("div");
  main.className="task-main";

  const txt = document.createElement("div");
  txt.className="task-text"; txt.textContent=task.text;

  const meta = document.createElement("div");
  meta.className="task-meta";
  const d = daysUntil(task.date);
  const dateLabel = d===0 ? "Today" : d===1 ? "Tomorrow" : d<0 ? `${Math.abs(d)}d ago` : `In ${d}d`;
  meta.innerHTML = `<span>${new Date(task.date+"T00:00:00").toLocaleDateString('en-GB',{day:'numeric',month:'short'})} · ${dateLabel}</span>`;
  if(task.isToets) meta.innerHTML += `<span class="badge badge-toets">Test</span>`;
  if(d<=1) meta.innerHTML += `<span class="badge badge-due">Coming up</span>`;
  if(task.isToets) meta.innerHTML += `<span class="badge badge-toets">${Math.max(1, Math.round(task.weight/10))} study sessions</span>`;

  main.appendChild(txt); main.appendChild(meta);

  const actions = document.createElement("div");
  actions.className="task-actions";

  if(task.isToets){
    const planBtn = document.createElement("button");
    planBtn.className="icon-btn"; planBtn.title="Study plan"; planBtn.textContent="📖";
    planBtn.addEventListener("click", ()=>{
      wrap.querySelector(".plan-panel").classList.toggle("open");
    });
    actions.appendChild(planBtn);
  }

  const delBtn = document.createElement("button");
  delBtn.className="icon-btn"; delBtn.title="Delete"; delBtn.textContent="✕";
  delBtn.addEventListener("click", ()=>{
    Tasks = Tasks.filter(t=>t.id!==task.id);
    saveTasks(); renderWindows(); renderCalendar();
  });
  actions.appendChild(delBtn);

  row.appendChild(cb); row.appendChild(main); row.appendChild(actions);
  wrap.appendChild(row);

  if(task.isToets){
    wrap.appendChild(buildPlanPanel(task));
  }

  return wrap;
}

function buildPlanPanel(task){
  const panel = document.createElement("div");
  panel.className="plan-panel";

  const steps = buildPlan(task);
  const stepsHtml = steps.map(s=>`
    <div class="plan-step ${s.isNow?'now':''} ${s.isDone?'done':''}">
      <div class="dot"></div>
      <span>${s.label}</span>
      <span class="when">${s.when}</span>
    </div>
  `).join("");

  panel.innerHTML = `
    <div class="plan-hint">Higher weight = more sessions. Sundays stay free.</div>
    <div class="plan-steps">${stepsHtml}</div>
    <div class="material-row" id="materialRow-${task.id}"></div>
  `;

  renderMaterialRow(task, panel.querySelector(`#materialRow-${task.id}`));
  return panel;
}

/* Study material detection: if a link is stored, show a button that
   opens the existing "leren" (learn) page. Otherwise, offer to add one. */
function renderMaterialRow(task, container){
  container.innerHTML = "";
  if(task.materialLink){
    const a = document.createElement("a");
    a.className = "material-link";
    a.href = task.materialLink;
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML = `📚 Open study material`;
    const edit = document.createElement("button");
    edit.className="icon-btn"; edit.style.width="30px"; edit.style.height="30px"; edit.style.fontSize="11px";
    edit.textContent="✎"; edit.title="Change link";
    edit.addEventListener("click", ()=>{
      task.materialLink="";
      saveTasks();
      renderMaterialRow(task, container);
    });
    container.appendChild(a);
    container.appendChild(edit);
  } else {
    const input = document.createElement("input");
    input.type="url";
    input.placeholder="Link to study material on leren.html";
    const btn = document.createElement("button");
    btn.className="btn btn-ghost btn-small";
    btn.textContent="Link";
    btn.addEventListener("click", ()=>{
      if(!input.value.trim()) return;
      task.materialLink = input.value.trim();
      saveTasks();
      renderMaterialRow(task, container);
    });
    container.appendChild(input);
    container.appendChild(btn);
  }
}

function completeTask(task, wrap){
  wrap.style.transition="opacity .3s ease, transform .3s ease";
  wrap.style.opacity="0"; wrap.style.transform="translateX(20px)";
  setTimeout(()=>{
    task.completed = true;
    saveTasks();
    renderWindows();
    renderCalendar();
  },300);
}

/* =========================================================
   AGENDA — real calendar grid, month view
   ========================================================= */
const agendaBtn = document.getElementById("agendaBtn");
const agendaOverlay = document.getElementById("agendaOverlay");
const calGrid = document.getElementById("calGrid");
const monthLabel = document.getElementById("monthLabel");

let viewMonth = new Date(); viewMonth.setDate(1); viewMonth.setHours(0,0,0,0);

agendaBtn.addEventListener("click", ()=>{
  viewMonth = new Date(); viewMonth.setDate(1); viewMonth.setHours(0,0,0,0);
  renderCalendar();
  agendaOverlay.classList.add("open");
});
document.getElementById("closeAgenda").addEventListener("click", ()=>agendaOverlay.classList.remove("open"));
agendaOverlay.addEventListener("click", (e)=>{ if(e.target===agendaOverlay) agendaOverlay.classList.remove("open"); });

document.getElementById("prevMonth").addEventListener("click", ()=>{
  viewMonth.setMonth(viewMonth.getMonth()-1); renderCalendar();
});
document.getElementById("nextMonth").addEventListener("click", ()=>{
  viewMonth.setMonth(viewMonth.getMonth()+1); renderCalendar();
});
document.getElementById("todayBtn").addEventListener("click", ()=>{
  viewMonth = new Date(); viewMonth.setDate(1); viewMonth.setHours(0,0,0,0); renderCalendar();
});

function eventsByDate(){
  // returns { "YYYY-MM-DD": [{label, type}] }
  const map = {};
  const add = (date, label, type)=>{
    if(!map[date]) map[date]=[];
    map[date].push({label, type});
  };

  Tasks.filter(t=>!t.completed).forEach(t=>{
    add(t.date, t.text, t.isToets ? "test" : "task");
    if(t.isToets){
      buildPlan(t).forEach(step=>{
        if(step.label==="Read" || step.date===t.date) return;
        add(step.date, `${step.label} — ${t.text}`, "study");
      });
    }
  });
  return map;
}

function renderCalendar(){
  const map = eventsByDate();
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
  monthLabel.textContent = viewMonth.toLocaleDateString('en-GB',{month:'long', year:'numeric'});

  calGrid.innerHTML = "";
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(dow=>{
    const el = document.createElement("div");
    el.className="cal-dow"; el.textContent=dow;
    calGrid.appendChild(el);
  });

  const firstDay = new Date(y,m,1);
  let startOffset = firstDay.getDay()-1; // Monday=0
  if(startOffset<0) startOffset=6;

  const daysInMonth = new Date(y,m+1,0).getDate();
  const todayIso = isoDate(new Date(new Date().setHours(0,0,0,0)));

  for(let i=0;i<startOffset;i++){
    const el = document.createElement("div");
    el.className="cal-cell empty";
    calGrid.appendChild(el);
  }

  for(let day=1; day<=daysInMonth; day++){
    const dateObj = new Date(y,m,day);
    const iso = isoDate(dateObj);
    const cell = document.createElement("div");
    cell.className = "cal-cell" + (iso===todayIso ? " today" : "") + (map[iso] ? " has-items" : "");

    const num = document.createElement("div");
    num.className="cal-daynum"; num.textContent=day;
    cell.appendChild(num);

    (map[iso]||[]).slice(0,3).forEach(ev=>{
      const chip = document.createElement("div");
      chip.className = "cal-chip" + (ev.type==="test" ? " test" : ev.type==="study" ? " study" : "");
      chip.textContent = ev.label;
      chip.title = ev.label;
      cell.appendChild(chip);
    });
    if((map[iso]||[]).length>3){
      const more = document.createElement("div");
      more.className="cal-chip"; more.textContent=`+${map[iso].length-3} more`;
      cell.appendChild(more);
    }

    calGrid.appendChild(cell);
  }
}

/* =========================================================
   INIT
   ========================================================= */
renderWindows();
renderCalendar();
</script>
