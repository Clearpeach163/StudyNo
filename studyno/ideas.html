```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submit idea</title>

    <link rel="icon" type="image/x-icon" href="studynologo.png">

    <style>
        input::placeholder,
        textarea::placeholder {
            color: rgba(222, 207, 233, 0.764);
        }
    </style>
</head>

<body>

    <!-- Terminal -->
    <div class="terminal hidden" id="terminal">

        <div class="terminal-header" id="terminal-header">
            <div class="dots"></div>
            <div class="title">terminal</div>
        </div>

        <div class="output"></div>

        <div class="input-line">
            <span>$</span>
            <input id="terminal-input">
        </div>

        <div class="resizer" id="resizer"></div>

    </div>

    <script src="terminal.js" defer></script>


    <!-- Submit form -->
    <div id="form">

        <a href="homescreen.html" id="nevermind">
            Never mind!
        </a>

        <h1 id="h1submit">
            Submit your idea!
        </h1>

        <form id="idea-form">

            <label>
                <input
                    type="text"
                    name="naam"
                    id="mail"
                    placeholder="example@example.com"
                    required
                >
            </label>

            <label>
                <textarea
                    name="message"
                    id="idea"
                    placeholder="Write your idea here"
                    required
                ></textarea>
            </label>

            <button type="submit" id="submit">
                Submit!
            </button>

        </form>

    </div>


    <!-- Formspree -->
    <script>
        const form = document.getElementById("idea-form");
        const button = document.getElementById("submit");

        form.addEventListener("submit", async function (event) {

            // Prevent Formspree from opening its own page
            event.preventDefault();

            // Prevent double submissions
            button.disabled = true;
            button.textContent = "Sending...";

            // Collect form data
            const formData = new FormData(form);

            try {

                const response = await fetch(
                    "https://formspree.io/f/xgobdyny",
                    {
                        method: "POST",
                        body: formData,
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                // Formspree accepted the submission
                if (response.ok) {

                    window.location.href = "redirect.html";

                } else {

                    button.disabled = false;
                    button.textContent = "Submit!";

                    alert(
                        "Something went wrong while submitting your idea."
                    );
                }

            } catch (error) {

                button.disabled = false;
                button.textContent = "Submit!";

                alert(
                    "Could not connect to Formspree. Please try again."
                );

                console.error(error);
            }

        });
    </script>

</body>
</html>
```
