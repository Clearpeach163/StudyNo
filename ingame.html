  <div id="togglemain">

    <div class="toggle" id="toggle">
      <div class="indicator" id="indicator"></div>

      <button data-mode="FN" id="FN">FN</button>
      <button class="active" data-mode="NF" id="NF">NF</button>
      <button data-mode="Shuffle">Shuffle</button>
    </div>
  </div>
<script>
  window.addEventListener("DOMContentLoaded", () => {
    const fnnf = localStorage.getItem("fnnf") || "NF";

    document.querySelectorAll("#toggle button").forEach(btn => {
        btn.classList.remove("active");

        if (btn.dataset.mode === fnnf) {
            btn.classList.add("active");
        }
    });

});


function updateMuteIcon() {
    document.getElementById('iconOn').style.display = muted ? 'none' : '';
    document.getElementById('iconOff').style.display = muted ? '' : 'none';
}

document.getElementById('muteBtn').addEventListener('click', () => {
    toggleMute();
    updateMuteIcon();
});

window.addEventListener('DOMContentLoaded', updateMuteIcon);
  </script>
