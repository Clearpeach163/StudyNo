<html>
   <head>
       <title>Dashboard</title>
         <link rel="stylesheet" href="style.css">
       <style>
        
/* =========================================================
   STUDYNO — LIQUID GLASS
   ========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: #fff;

}


/* =========================================================
   TOP LINKS
   ========================================================= */






/* =========================================================
   VERSION
   ========================================================= */


/* =========================================================
   BACK BUTTON
   ========================================================= */


#back:hover {
    background: rgba(255,255,255,0.14);
    transform: scale(1.05);
}

#back:active {
    transform: scale(0.95);
}


/* =========================================================
   HERO
   ========================================================= */

#hero {
    position: relative;

    margin: 110px 0 45px;

    text-align: center;

    font-size: clamp(42px, 6vw, 72px);
    font-weight: 650;
    letter-spacing: -3px;

    color: white;

    text-shadow:
        0 10px 40px rgba(0,0,0,0.35);
}


/* =========================================================
   NEW TASK PANEL
   ========================================================= */

.new-event {
    position: relative;

    width: min(900px, 75%);

    margin: 0 auto;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 12px;

    border-radius: 999px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.14),
            rgba(255,255,255,0.055)
        );

    border: 1px solid rgba(255,255,255,0.16);

    backdrop-filter:
        blur(30px)
        saturate(180%);

    -webkit-backdrop-filter:
        blur(30px)
        saturate(180%);

    box-shadow:
        0 20px 70px rgba(0,0,0,0.35),
        inset 0 1px rgba(255,255,255,0.18),
        inset 0 -1px rgba(0,0,0,0.15);
}


/* =========================================================
   TEXT / DATE INPUT
   ========================================================= */

#inputField,
#dateField {

    height: 48px;

    border: 1px solid rgba(255,255,255,0.12);

    border-radius: 999px;

    padding: 0 18px;

    background: rgba(255,255,255,0.075);

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    color: rgba(255,255,255,0.9);

    outline: none;

    font-size: 15px;

    box-shadow:
        inset 0 1px rgba(255,255,255,0.08);

    transition:
        background 0.2s ease,
        border 0.2s ease,
        box-shadow 0.2s ease;
}


#inputField {
    flex: 1;
    min-width: 0;
}

#dateField {
    width: 160px;
}


/* Placeholder */

#inputField::placeholder {
    color: rgba(255,255,255,0.45);
}


/* Focus */

#inputField:focus,
#dateField:focus {
    background: rgba(255,255,255,0.11);

    border-color: rgba(255,255,255,0.25);

    box-shadow:
        0 0 0 3px rgba(170,130,255,0.10),
        inset 0 1px rgba(255,255,255,0.12);
}


/* =========================================================
   RANGE SLIDER
   ========================================================= */

input[type="range"] {
    width: 120px;

    height: 32px;

    appearance: none;
    -webkit-appearance: none;

    background: transparent;

    cursor: pointer;
}


/* Track */

input[type="range"]::-webkit-slider-runnable-track {
    height: 7px;

    border-radius: 999px;

    background: rgba(255,255,255,0.12);

    border: 1px solid rgba(255,255,255,0.12);

    box-shadow:
        inset 0 1px rgba(255,255,255,0.08),
        inset 0 -1px rgba(0,0,0,0.25);
}


/* Thumb */

input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 25px;
    height: 25px;

    margin-top: -10px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,0.8);

    background: rgba(255,255,255,0.9);

    box-shadow:
        0 4px 15px rgba(0,0,0,0.35),
        inset 0 1px rgba(255,255,255,1);

    transition: transform 0.15s ease;
}

input[type="range"]:hover::-webkit-slider-thumb {
    transform: scale(1.08);
}


/* Firefox */

input[type="range"]::-moz-range-track {
    height: 7px;

    border-radius: 999px;

    background: rgba(255,255,255,0.12);

    border: 1px solid rgba(255,255,255,0.12);
}

input[type="range"]::-moz-range-thumb {
    width: 25px;
    height: 25px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,0.8);

    background: rgba(255,255,255,0.9);

    box-shadow:
        0 4px 15px rgba(0,0,0,0.35);
}


/* =========================================================
   TOETS CHECKBOX
   ========================================================= */

.checkbox-wrapper-24 {
    display: flex;
    align-items: center;

    white-space: nowrap;
}

.checkbox-wrapper-24 input {
    display: none;
}

.checkbox-wrapper-24 label {
    display: flex;
    align-items: center;

    gap: 8px;

    color: rgba(255,255,255,0.75);

    font-size: 14px;

    cursor: pointer;
}

.checkbox-wrapper-24 label span {

    width: 22px;
    height: 22px;

    display: inline-block;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,0.3);

    background: rgba(255,255,255,0.06);

    transition:
        0.2s ease;
}


/* Checked */

.checkbox-wrapper-24 input[type="checkbox"]:checked + label span {

    background: rgba(255,255,255,0.9);

    border-color: white;

    box-shadow:
        0 0 15px rgba(255,255,255,0.2);

    transform: scale(1.05);
}


/* =========================================================
   ADD BUTTON
   ========================================================= */

.split-btn {

    position: relative;

    height: 48px;

    padding: 0 22px;

    border: 1px solid rgba(255,255,255,0.8);

    border-radius: 999px;

    background: rgba(255,255,255,0.92);

    color: #111;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    overflow: hidden;

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}

.split-btn:hover {
    background: white;

    transform: scale(1.03);
}

.split-btn:active {
    transform: scale(0.97);
}


/* =========================================================
   TASK CONTAINER
   ========================================================= */

.task-container {

    width: min(850px, 70%);

    margin: 25px auto 0;

    display: flex;

    flex-direction: column;

    gap: 10px;
}


/* =========================================================
   TASK
   ========================================================= */

.task-list {

    min-height: 58px;

    display: flex;
    align-items: center;

    gap: 14px;

    padding: 10px 18px;

    border-radius: 20px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.105),
            rgba(255,255,255,0.045)
        );

    border: 1px solid rgba(255,255,255,0.12);

    backdrop-filter:
        blur(25px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(25px)
        saturate(160%);

    box-shadow:
        0 10px 35px rgba(0,0,0,0.20),
        inset 0 1px rgba(255,255,255,0.10);

    color: rgba(255,255,255,0.9);

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}


.task-list:hover {

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.14),
            rgba(255,255,255,0.06)
        );

}


/* =========================================================
   TASK CHECKBOX
   ========================================================= */

.task-list input[type="checkbox"] {

    width: 19px;
    height: 19px;

    margin: 0;

    flex-shrink: 0;

    accent-color: white;

    cursor: pointer;
}


/* =========================================================
   TASK TEXT
   ========================================================= */

.task-list span {

    font-size: 16px;

    color: rgba(255,255,255,0.88);
}


/* =========================================================
   TOETS TASK
   ========================================================= */

.task-list.test-task {

    border: 2px solid rgba(194, 145, 221, 0.42);

    background:
        linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.225),
            rgba(255,255,255,0.055)
        );

    box-shadow:
        0 10px 35px rgba(0,0,0,0.35),
        inset 0 1px rgba(255,255,255,0.16);
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 750px) {

    #hero {
        margin-top: 100px;
        font-size: 45px;
    }

    .new-event {

        width: calc(100% - 30px);

        border-radius: 25px;

        flex-wrap: wrap;
    }

    #inputField {
        width: 100%;
        flex-basis: 100%;
    }

    #dateField {
        flex: 1;
        width: auto;
    }

    input[type="range"] {
        flex: 1;
    }

   
  
}
</style>
       
   </head>

<div class="planner"></div>
   <div class="new-event">


       <input type="text" id="inputField" placeholder="Enter a task">


       <input type="date" id="dateField">


       <input type="range" min="1" max="50">


       <div class="checkbox-wrapper-24">
           <input type="checkbox" id="check-24" name="Toets" value="">
           <label for="check-24">
               <span></span>Toets
           </label>

</body>
  <script>
    
const main_text = document.getElementById("hero");
let name = localStorage.getItem("name");

if (name) {
    main_text.textContent = `Hey,  ${name}`;
} else {
    no_name();
}

function no_name() {
    name = prompt("Please enter your name:");

    if (name) {
        localStorage.setItem("name", name);
        main_text.textContent = `Hey,  ${name}`;
    } else {
        main_text.textContent = "Hey,  Guest";
    }
}







const Tasks = JSON.parse(localStorage.getItem("Tasks")) || [];

const addButton = document.getElementById("add");
const taskContainer = document.getElementById("taskContainer");


// ================================
// ADD BUTTON
// ================================

addButton.addEventListener("click", function () {
    getdata();
});


// ================================
// GET DATA FROM FORM
// ================================

function getdata() {
    const inputField = document.getElementById("inputField");
    const testCheckbox = document.getElementById("check-24");
    const dateField = document.getElementById("dateField");
    const weightSlider = document.querySelector('input[type="range"]');

    const text = inputField.value.trim();
    const date = dateField.value;
    const weight = Number(weightSlider.value);

    // Geen lege tasks
    if (text === "") {
        alert("Enter a task!");
        return;
    }

    // Geen datum
    if (date === "") {
        alert("Select a date!");
        return;
    }


    const mytask = {
        text: text,

        // TRUE = toets
        // FALSE = normale task
        checked: testCheckbox.checked,

        // Datum van de task/toets
        date: date,

        // Belangrijkheid
        weight: weight,

        // Of de gebruiker de task heeft afgemaakt
        completed: false
    };


    Tasks.push(mytask);

    saveTasks();

    renderTasks();


    // Form resetten
    inputField.value = "";
    dateField.value = "";
    testCheckbox.checked = false;
    weightSlider.value = 1;
}


// ================================
// SAVE
// ================================

function saveTasks() {
    localStorage.setItem("Tasks", JSON.stringify(Tasks));
}


// ================================
// HOW MANY DAYS BEFORE?
// ================================

function getDaysBefore(weight) {

    if (weight <= 10) return 1;

    if (weight <= 20) return 2;

    if (weight <= 30) return 3;

    if (weight <= 40) return 5;

    return 7;
}


// ================================
// SHOULD TASK BE VISIBLE?
// ================================

function shouldShowTask(task) {

    const today = new Date();

    today.setHours(0, 0, 0, 0);


    const taskDate = new Date(task.date + "T00:00:00");


    const daysBefore = getDaysBefore(task.weight);


    const showDate = new Date(taskDate);

    showDate.setDate(
        showDate.getDate() - daysBefore
    );


    return today >= showDate;
}


// ================================
// CREATE TASK ELEMENT
// ================================

function newTaskElement(task) {

    const taskElement = document.createElement("div");

    taskElement.className = "task-list";


    // ================================
    // TEST / TOETS
    // ================================

    // checked betekent bij jou:
    // TRUE = dit is een toets

    if (task.checked) {
        taskElement.classList.add("test-task");
    }


    // ================================
    // COMPLETED CHECKBOX
    // ================================

    const completeCheckbox = document.createElement("input");

    completeCheckbox.type = "checkbox";

    // Dit is NIET task.checked.
    // Dit is of de task daadwerkelijk af is.
    completeCheckbox.checked = task.completed;


    // ================================
    // TASK TEXT
    // ================================

    const text = document.createElement("span");

    text.textContent = task.text;


    // ================================
    // WHEN COMPLETED
    // ================================

completeCheckbox.addEventListener("change", function () {

    if (!completeCheckbox.checked) return;

    // Alle huidige task-posities onthouden
    const taskElements = [...taskContainer.children];

    const oldPositions = new Map();

    taskElements.forEach(element => {
        oldPositions.set(element, element.getBoundingClientRect());
    });


    // Fade de aangeklikte task uit
    taskElement.style.transition = "opacity 0.35s ease, transform 0.35s ease";
    taskElement.style.opacity = "0";
    taskElement.style.transform = "translateX(20px)";


    setTimeout(() => {

        // Uit Tasks verwijderen
        const index = Tasks.indexOf(task);

        if (index !== -1) {
            Tasks.splice(index, 1);
        }

        saveTasks();

        // Task uit DOM verwijderen
        taskElement.remove();


        // Nieuwe posities bepalen
        const remainingTasks = [...taskContainer.children];

        remainingTasks.forEach(element => {

            const oldPosition = oldPositions.get(element);

            if (!oldPosition) return;

            const newPosition = element.getBoundingClientRect();

            const difference =
                oldPosition.top - newPosition.top;


            // Task tijdelijk terugzetten naar oude positie
            element.style.transform =
                `translateY(${difference}px)`;

            element.style.transition = "none";


            // Browser layout laten uitvoeren
            requestAnimationFrame(() => {

                element.style.transition =
                    "transform 0.45s cubic-bezier(.2,.8,.2,1)";

                element.style.transform = "translateY(0)";

            });

        });

    }, 350);

});

    // ================================
    // ADD TO DOM
    // ================================

    taskElement.appendChild(completeCheckbox);

    taskElement.appendChild(text);

    taskContainer.appendChild(taskElement);
}


// ================================
// RENDER ALL TASKS
// ================================

function renderTasks() {

    // Eerst oude tasks verwijderen
    taskContainer.innerHTML = "";


    Tasks.forEach(function (task) {

        // Alleen tonen als de planning zegt
        // dat hij nu zichtbaar moet zijn
        if (shouldShowTask(task)) {

            newTaskElement(task);

        }

    });
}


// ================================
// INITIAL LOAD
// ================================

renderTasks();
  </script>
