
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>StudyNo. — sessie instellen</title>
<link rel="stylesheet" href="style.css">
<script src="Update.js" defer></script>
<script src="script.js" defer></script>
<style>
  body{
    margin:0; min-height:100vh;
   
    display:flex; align-items:center; justify-content:center;
    font-family:sans-serif;
  }
</style>
</head>
<body>

<div id="sno-mount"></div>

<script>
/* =====================================================================
   StudyNoSessionModal
   CSS volledig geïsoleerd via Shadow DOM.

   Studiestijl is nu 4 elkaar uitsluitende opties i.p.v. 3 + losse toggle:
   Leren / Oefenen / Toets / Luistertoets.
   "Toets"-gedrag (fout woord komt niet terug) hoort bij de aard van de
   modus zelf, dus kan niet los aan- of uitgezet worden op Leren/Oefenen —
   dat gaf een ongeldige combinatie. toetsModus wordt afgeleid, niet gekozen.

   Gebruik:
     StudyNoSessionModal.open({
       subjectLabel: "Frans · 1e leerjaar",
       chapterTitle: "Marche 1 fix",
       wordCount: 42
     }, (result) => {
       // result = { fnnf: 0|1|2, studyStyle: 'leren'|'oefenen'|'toets'|'luister', toetsModus: bool }
       localStorage.setItem("fnnf", result.fnnf);
       localStorage.setItem("studyStyle", result.studyStyle);
       localStorage.setItem("toetsModus", result.toetsModus);
       window.location.href = "ingame.html";
     });
===================================================================== */
(function(){

  const TEMPLATE = `
  <style>
    :host{ all:initial; }

    .overlay{
      position:fixed; inset:0; z-index:999999;
      display:flex; align-items:center; justify-content:center;
      padding:20px;


      font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
      animation: sno-fade 0.2s ease;
      box-sizing:border-box;
    }
    .overlay *{ box-sizing:border-box; }
    @keyframes sno-fade{ from{opacity:0;} to{opacity:1;} }



    .modal{
      position:relative;
      width:min(460px, 100%);
      max-height:92vh;
      overflow-y:auto;
      padding:30px 28px 24px;
      border-radius:30px;
      background: linear-gradient(180deg, rgba(36,24,64,0.62), rgba(20,12,40,0.72));
      backdrop-filter: blur(34px) saturate(180%);
      -webkit-backdrop-filter: blur(34px) saturate(180%);
      border:1px solid rgba(255,255,255,0.14);
      box-shadow:
        0 24px 70px -18px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.22);
      animation: sno-rise 0.42s cubic-bezier(0.32,0.72,0,1);
    }
    @keyframes sno-rise{
      from{ opacity:0; transform:translateY(14px) scale(0.98); }
      to{ opacity:1; transform:translateY(0) scale(1); }
    }

    .eyebrow{
      font-size:11px; font-weight:600; letter-spacing:0.1em;
      text-transform:uppercase; color:rgba(196,181,253,0.85); margin-bottom:6px;
    }
    .title-row{
      display:flex; align-items:baseline; justify-content:space-between;
      gap:12px; margin-bottom:2px;
    }
    .chapter-title{
      font-size:24px; font-weight:700; color:#f5f3ff;
      letter-spacing:-0.01em; line-height:1.2;
    }
    .word-count{
      flex-shrink:0; font-size:12.5px; font-weight:600;
      color:rgba(229,224,255,0.55);
      background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.1);
      padding:5px 11px; border-radius:999px; white-space:nowrap;
    }
    .word-count b{ color:#f5f3ff; font-weight:700; }

    .divider{
      height:1px; margin:18px 0 20px;
      background:rgba(255,255,255,0.1);
    }
    .section-label{
      font-size:12px; font-weight:600; letter-spacing:0.04em;
      color:rgba(229,224,255,0.5); margin-bottom:9px; display:block;
    }

    /* Richting: iOS-achtige segmented control, rustiger dan voorheen */
    .segmented{
      position:relative; display:flex;
      background:rgba(0,0,0,0.25);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:13px; padding:4px; gap:2px;
    }
    .segmented button{
      all:unset; flex:1; position:relative; z-index:2;
      text-align:center; color:rgba(229,224,255,0.5);
      font-size:13px; font-weight:600; padding:8px 6px;
      border-radius:9px; cursor:pointer; transition:color .2s ease;
    }
    .segmented button.active{ color:#fff; }
    .indicator{
      position:absolute; top:4px; bottom:4px; left:4px;
      width:calc(33.33% - 4px); border-radius:9px;
      background:rgba(139,92,246,0.85);
      box-shadow:0 1px 4px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
      transition:transform .38s cubic-bezier(0.32,0.72,0,1); z-index:1;
    }

    .mode-block{ margin-bottom:18px; }
    .mode-block:last-of-type{ margin-bottom:6px; }

    /* Studiestijl: 4 elkaar uitsluitende opties, geen losse toets-toggle meer */
    .style-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .style-card{
      position:relative; padding:14px 14px 13px; border-radius:18px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      cursor:pointer; text-align:left;
      transition:border-color .2s ease, background .2s ease, transform .12s ease;
    }
    .style-card:active{ transform:scale(0.98); }
    .style-card.active{
      background:rgba(139,92,246,0.16);
      border-color:rgba(167,139,250,0.55);
    }
    .style-card .icon{
      width:22px; height:22px; margin-bottom:9px;
      display:flex; align-items:center; justify-content:center;
      color:rgba(196,181,253,0.9);
    }
    .style-card.active .icon{ color:#e9e2ff; }
    .style-card .icon svg{ width:19px; height:19px; }
    .style-card .name{ font-size:13px; font-weight:700; color:#f5f3ff; }
    .style-card .sub{ font-size:10.5px; color:rgba(229,224,255,0.5); margin-top:2px; line-height:1.35; }

    /* selectie-badge: check in cirkel, zoals iOS-lijstselectie */
    .check{
      position:absolute; top:10px; right:10px;
      width:16px; height:16px; border-radius:50%;
      background:#a78bfa;
      display:flex; align-items:center; justify-content:center;
      opacity:0; transform:scale(0.5);
      transition:opacity .18s ease, transform .25s cubic-bezier(0.32,0.72,0,1);
    }
    .style-card.active .check{ opacity:1; transform:scale(1); }
    .check svg{ width:10px; height:10px; stroke:#1c1030; }

    .cta{ margin-top:22px; display:flex; gap:8px; }
    .cta button{
      all:unset; box-sizing:border-box;
      font-weight:600; font-size:14px; border-radius:13px;
      padding:13px 16px; cursor:pointer; text-align:center;
      transition:transform .12s ease, filter .2s ease, background .2s ease;
    }
    .cta button:active{ transform:scale(0.97); }
    .cta .cancel{
      background:rgba(255,255,255,0.06); color:rgba(229,224,255,0.65);
    }
    .cta .cancel:hover{ background:rgba(255,255,255,0.1); color:#f5f3ff; }
    .cta .start{
      flex:1;
      background:rgba(139,92,246,0.9);
      color:#fff;
      display:flex; align-items:center; justify-content:center; gap:7px;
    }
    .cta .start:hover{ background:rgba(149,104,255,0.95); }
    .cta .start svg{ width:15px; height:15px; }

    @media (max-width:380px){
      .modal{ padding:24px 18px 20px; }
      .chapter-title{ font-size:21px; }
    }
  </style>

  <div class="overlay">
    <div class="glow"></div>
    <div class="modal">
      <div class="eyebrow" id="sno-subject">Frans · 1e leerjaar</div>
      <div class="title-row">
        <div class="chapter-title" id="sno-chapter">Marche 1 fix</div>
        <div class="word-count"><b id="sno-wc">42</b> woorden</div>
      </div>

      <div class="divider"></div>

      <div class="mode-block">
        <span class="section-label">Richting</span>
        <div class="segmented" id="fnnfSeg">
          <div class="indicator" id="fnnfIndicator"></div>
          <button data-val="1" class="active">FN</button>
          <button data-val="0">NF</button>
          <button data-val="2">Shuffle</button>
        </div>
      </div>

      <div class="mode-block">
        <span class="section-label">Studiestijl</span>
        <div class="style-grid" id="styleGrid">
      
          <div class="style-card" data-val="oefenen">
            <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
            <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.1l4 4-4 4"/><path d="M3 12.2v-2a4 4 0 0 1 4-4h14"/><path d="M7 21.9l-4-4 4-4"/><path d="M21 11.8v2a4 4 0 0 1-4 4H3"/></svg></div>
            <div class="name">Oefenen</div>
            <div class="sub">Fout mag, woord komt terug</div>
          </div>
          <div class="style-card" data-val="toets">
            <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
            <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
            <div class="name">Toets</div>
            <div class="sub">Eén kans, fout blijft fout</div>
          </div>
         
        </div>
      </div>

      <div class="cta">
        <button class="cancel" id="sno-cancel">Annuleren</button>
        <button class="start" id="sno-start">
          Start sessie
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
  `;

  // modi die "toets-gedrag" hebben: fout woord komt niet terug.
  // Dit is een eigenschap van de modus zelf, geen losse instelling.
  const TOETS_STYLES = ['toets', 'luister'];

  const StudyNoSessionModal = {

    open(data, onStart, onCancel){
      const host = document.createElement('div');
      document.body.appendChild(host);
      const shadow = host.attachShadow({ mode: 'open' });
      shadow.innerHTML = TEMPLATE;

      shadow.getElementById('sno-subject').textContent = "";
      shadow.getElementById('sno-chapter').textContent = "Not found 404";
      shadow.getElementById('sno-wc').textContent = "";

      // --- Richting: FN / NF / Shuffle ---
      const fnnfIndicator = shadow.getElementById('fnnfIndicator');
      const fnnfButtons = shadow.querySelectorAll('#fnnfSeg button');
      let fnnfValue = 1;

      function moveIndicator(btn){
        const index = [...fnnfButtons].indexOf(btn);
        fnnfIndicator.style.transform = `translateX(${index * 100}%)`;
      }
      fnnfButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          fnnfButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          fnnfValue = parseInt(btn.dataset.val);
          moveIndicator(btn);
        });
      });

      // --- Studiestijl: 4 losse, elkaar uitsluitende opties ---
      const styleCards = shadow.querySelectorAll('.style-card');
      let studyStyle = 'leren';

      styleCards.forEach(card => {
        card.addEventListener('click', () => {
          styleCards.forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          studyStyle = card.dataset.val;
        });
      });

      // --- knoppen ---
      shadow.getElementById('sno-cancel').addEventListener('click', () => {
        host.remove();
        if (onCancel) onCancel();
      });
      shadow.getElementById('sno-start').addEventListener('click', () => {
        const result = {
          fnnf: fnnfValue,
          studyStyle,
          toetsModus: TOETS_STYLES.includes(studyStyle) // afgeleid, niet los instelbaar
        };
        host.remove();
        if (onStart) onStart(result);
      });

      shadow.querySelector('.overlay').addEventListener('click', (e) => {
        if (e.target === shadow.querySelector('.overlay')){
          host.remove();
          if (onCancel) onCancel();
        }
      });
    }
  };

  window.StudyNoSessionModal = StudyNoSessionModal;
})();

StudyNoSessionModal.open(
  { subjectLabel: "Frans · 1e leerjaar", chapterTitle: "Marche 1 fix", wordCount: 42 },
  (result) => {
    localStorage.setItem("fnnf", result.fnnf);
    localStorage.setItem("studyStyle", result.studyStyle);
    localStorage.setItem("toetsModus", result.toetsModus);

    window.location.href = "ingame.html";
  },
  () => {
    window.location.href = "homescreen.html";
  }
);
</script>

</body>
</html>
