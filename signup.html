
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup - StudyNo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                Inter,
                Arial,
                sans-serif;

      

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            color: rgb(216, 203, 223);
        }

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;

            background: rgba(120, 90, 255, 0.16);
            filter: blur(100px);

            top: -180px;
            left: -150px;

            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;

            background: rgba(0, 160, 255, 0.12);
            filter: blur(100px);

            bottom: -180px;
            right: -150px;

            pointer-events: none;
        }

        .signup {
            position: relative;
            z-index: 1;

            width: min(420px, calc(100% - 40px));

            padding: 42px 38px 34px;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            border-radius: 32px;

            background: rgba(255, 255, 255, 0.09);

            border: 1px solid rgba(255, 255, 255, 0.18);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                inset 0 -1px 0 rgba(255, 255, 255, 0.04);

            backdrop-filter: blur(10px) saturate(130%);
            -webkit-backdrop-filter: blur(10px) saturate(130%);
        }

        .signup::before {
            content: "";

            position: absolute;
            inset: 1px;

            border-radius: 31px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.12),
                    transparent 35%,
                    transparent 65%,
                    rgba(255, 255, 255, 0.04)
                );

            pointer-events: none;
        }

        .signup input {
            position: relative;
            z-index: 2;

            width: 100%;
            height: 52px;

            margin: 7px 0;

            padding: 0 18px;

            border-radius: 17px;

            border: 1px solid rgba(255, 255, 255, 0.12);

            outline: none;

            color: rgb(216, 203, 223);
            font-size: 16px;
            font-family: inherit;

            background: rgba(255, 255, 255, 0.08);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.06);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            transition:
                background 0.2s ease,
                border 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .signup input::placeholder {
            color: rgba(255, 255, 255, 0.48);
        }

        .signup input:focus {
            background: rgba(255, 255, 255, 0.13);

            border-color: rgba(255, 255, 255, 0.35);

            box-shadow:
                0 0 0 4px rgba(255, 255, 255, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .signup input.error {
            border-color: rgba(255, 90, 90, 0.6);
            box-shadow:
                0 0 0 4px rgba(255, 90, 90, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .signup button {
            position: relative;
            z-index: 2;

            width: 100%;
            height: 52px;

            margin-top: 14px;

            border: none;
            border-radius: 17px;

            background: rgba(255, 255, 255, 0.92);

            color: #111;

            font-family: inherit;
            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                box-shadow 0.18s ease,
                opacity 0.18s ease;
        }

        .signup button:hover {
            transform: translateY(-1px);

            background: white;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 white;
        }

        .signup button:active {
            transform: scale(0.98);
        }

        .signup button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #link {
            position: relative;
            z-index: 2;

            margin-top: 22px;

            color: rgba(255, 255, 255, 0.65);

            text-decoration: none;

            font-size: 14px;

            transition:
                color 0.2s ease;
        }

        #link:hover {
            color: white;
        }

        #error-msg {
            position: relative;
            z-index: 2;
            width: 100%;
            min-height: 18px;
            margin-top: 10px;
            font-size: 13px;
            color: rgb(255, 130, 130);
            text-align: center;
        }

        @media (max-width: 500px) {
            .signup {
                padding: 32px 24px 28px;
                border-radius: 26px;
            }

            .signup::before {
                border-radius: 25px;
            }
        }

        .logo a {
            color: white;
        }
    </style>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="logo"><a href="index.html">StudyNo.</a></div>
    </nav>

    <div class="signup">
        <h1>Getting started!</h1>
        <input type="text" placeholder="Username" id="username" autocomplete="username">
        <input type="password" id="password" placeholder="Password" autocomplete="new-password">
        <input type="password" id="password-confirm" placeholder="Confirm your password" autocomplete="new-password">
        <input type="text" id="name" placeholder="What should we call you? (First name)">

        <div id="error-msg"></div>

        <button id="signup-btn" onclick="signup();">Signup!</button>

        <a href="login.html" id="link">Already have an account?</a>
    </div>

</body>

<script src="database.js"></script>

<script>
function showError(msg) {
    document.getElementById("error-msg").textContent = msg;
}

function clearFieldErrors() {
    ["username", "password", "password-confirm", "name"].forEach(id => {
        document.getElementById(id).classList.remove("error");
    });
}

function markFieldError(id) {
    document.getElementById(id).classList.add("error");
}

async function signup() {
    const btn = document.getElementById("signup-btn");

    showError("");
    clearFieldErrors();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("password-confirm").value;
    const name = document.getElementById("name").value.trim();

    // Validate before hitting the network at all
    if (!username) {
        markFieldError("username");
        showError("Please enter a username.");
        return;
    }
    if (!password) {
        markFieldError("password");
        showError("Please enter a password.");
        return;
    }
    if (password.length < 6) {
        markFieldError("password");
        showError("Password must be at least 6 characters.");
        return;
    }
    if (password !== confirm) {
        markFieldError("password-confirm");
        showError("Passwords do not match.");
        return;
    }
    if (!name) {
        markFieldError("name");
        showError("Please tell us what to call you.");
        return;
    }

    btn.disabled = true;
    btn.textContent = "Creating account...";

    try {
        // 1. Register the account
        const registered = await DB.register(username, password);

        if (!registered.success) {
            showError(registered.error || "Could not create account.");
            return;
        }

        // 2. Log in immediately
        const loggedIn = await DB.login(username, password);

        if (!loggedIn.success) {
            showError(loggedIn.error || "Account created, but login failed. Try logging in manually.");
            return;
        }

        // 3. Save the display name against this user's row
        const saved = await DB.add(name, "D");

        if (!saved.success) {
            showError(saved.error || "Account created, but saving your name failed.");
            return;
        }

        location.href = "index.html";

    } catch (err) {
        console.error("Signup error:", err);
        showError("Something went wrong. Check your connection and try again.");

    } finally {
        btn.disabled = false;
        btn.textContent = "Signup!";
    }
}
async function whosthere() {
if (DB.isLoggedIn()) {
const name = await DB.get("D");
console.log("Hey, I think i got the name: " + name.data);
localStorage.setItem("name_database", name.data);
}

}
</script>

</html>
