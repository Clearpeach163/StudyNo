<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup - StudyNo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                Inter,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(120, 90, 255, 0.35),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 75%,
                    rgba(0, 180, 255, 0.25),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #08090d,
                    #11131c 50%,
                    #08090d
                );

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            color: rgb(216, 203, 223);
        }

        /* Soft background glow */
        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;

            background: rgba(120, 90, 255, 0.16);
            filter: blur(100px);

            top: -180px;
            left: -150px;

            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;

            background: rgba(0, 160, 255, 0.12);
            filter: blur(100px);

            bottom: -180px;
            right: -150px;

            pointer-events: none;
        }

        .signup {
            position: relative;
            z-index: 1;

            width: min(420px, calc(100% - 40px));

            padding: 42px 38px 34px;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            border-radius: 32px;

            background: rgba(255, 255, 255, 0.09);

            border: 1px solid rgba(255, 255, 255, 0.18);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                inset 0 -1px 0 rgba(255, 255, 255, 0.04);

            backdrop-filter: blur(10px) saturate(130%);
            -webkit-backdrop-filter: blur(10px) saturate(130%);
        }

        .signup::before {
            content: "";

            position: absolute;
            inset: 1px;

            border-radius: 31px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.12),
                    transparent 35%,
                    transparent 65%,
                    rgba(255, 255, 255, 0.04)
                );

            pointer-events: none;
        }

        .signup input {
            position: relative;
            z-index: 2;

            width: 100%;
            height: 52px;

            margin: 7px 0;

            padding: 0 18px;

            border-radius: 17px;

            border: 1px solid rgba(255, 255, 255, 0.12);

            outline: none;

            color: rgb(216, 203, 223);
            font-size: 16px;
            font-family: inherit;

            background: rgba(255, 255, 255, 0.08);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.06);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            transition:
                background 0.2s ease,
                border 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .signup input::placeholder {
            color: rgba(255, 255, 255, 0.48);
        }

        .signup input:focus {
            background: rgba(255, 255, 255, 0.13);

            border-color: rgba(255, 255, 255, 0.35);

            box-shadow:
                0 0 0 4px rgba(255, 255, 255, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .signup button {
            position: relative;
            z-index: 2;

            width: 100%;
            height: 52px;

            margin-top: 14px;

            border: none;
            border-radius: 17px;

            background: rgba(255, 255, 255, 0.92);

            color: #111;

            font-family: inherit;
            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                box-shadow 0.18s ease;
        }

        .signup button:hover {
            transform: translateY(-1px);

            background: white;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 white;
        }

        .signup button:active {
            transform: scale(0.98);
        }

        #link {
            position: relative;
            z-index: 2;

            margin-top: 22px;

            color: rgba(255, 255, 255, 0.65);

            text-decoration: none;

            font-size: 14px;

            transition:
                color 0.2s ease;
        }

        #link:hover {
            color: white;
        }

        @media (max-width: 500px) {
            .signup {
                padding: 32px 24px 28px;
                border-radius: 26px;
            }

            .signup::before {
                border-radius: 25px;
            }
        }
        .logo a {
            color: white;
        }
    </style>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
    <div class="logo"><a href="index.html">StudyNo.</a></div>
    </nav>
    <div class="signup">
        <h1>Getting started!</h1>
        <input type="text" placeholder="Username" id="username">
        <input type="password" id="password" placeholder="Password">
        <input type="password" id="password-confirm" placeholder="Confirm your password">
        <input type="name" id="name" placeholder="What should we call you? (First name)">

        <button onclick="signup();">Signup!</button>

        <a href="login.html" id="link">Already have an account?</a>
    </div>

</body>

<script src="database.js"></script>

<script>
async function signup() {
    const confirm = document.getElementById("password-confirm").value;
    const password = document.getElementById("password").value;
    const username = document.getElementById("username").value;
    const name = document.getElementById("name").value;

    if (password !== confirm) {
        alert("password does not match.");
        return;
    }

    // Account maken
    const registered = await DB.register(username, password);

    if (!registered.success) {
        alert(registered.error);
        return;
    }

    // Meteen inloggen
    const loggedIn = await DB.login(username, password);

    if (!loggedIn.success) {
        alert(loggedIn.error);
        return;
    }

    // Naam opslaan in de rij van deze gebruiker
    const saved = await DB.add(name, "D");

    if (!saved.success) {
        alert(saved.error);
        return;
    }

    location.href = "index.html";
}
</script>

</html>
